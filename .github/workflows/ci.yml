name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Semua branch tetap terscan; hanya tag (dorong workflow Release) yang tidak memicu suite.
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Urutan ini mengikuti urutan dependensi: setiap package export tipe dari
      # `dist/`, dan lint type-aware membutuhkan tipe tersebut, jadi build harus
      # jalan lebih dulu. Urutannya sengaja dipertahankan terpisah (build, lint,
      # typecheck, test, budget) agar kegagalan pada setiap gate terlihat
      # sendiri. Sinkron dengan `package.json` root (`build` = turbo run build
      # && pnpm lint).
      - run: pnpm exec turbo run build
      # Suite ql_orm punya jalur dialect Postgres yang hanya aktif jika QL_ORM_PG_URL terisi.
      - run: pnpm test
        env:
          QL_ORM_PG_URL: postgres://ci:ci@127.0.0.1:5432/ci
      # Budget per rute First Load JS, diukur dari manifest yang ditulis `next build` pada langkah build di atas.
      - run: pnpm --filter @moonwitness/web size
