name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint memakai rule type-aware dan setiap package export tipe dari dist/,
      # jadi build harus jalan lebih dulu atau lint hanya melaporkan tipe tak ter-resolve.
      - run: pnpm exec turbo run build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
