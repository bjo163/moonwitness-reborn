name: CI

on:
  pull_request:
  # Semua branch tetap terscan; hanya tag (dorong workflow Release) yang tidak memicu suite.
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tracker:check
      - run: pnpm tracker:test
      # Lint memakai rule type-aware dan setiap package export tipe dari dist/,
      # jadi build harus jalan lebih dulu atau lint hanya melaporkan tipe tak ter-resolve.
      - run: pnpm exec turbo run build
      - run: pnpm lint
      - run: pnpm typecheck
      # Suite ql_orm punya jalur dialect Postgres yang hanya aktif jika QL_ORM_PG_URL terisi.
      - run: pnpm test
        env:
          QL_ORM_PG_URL: postgres://ci:ci@127.0.0.1:5432/ci
