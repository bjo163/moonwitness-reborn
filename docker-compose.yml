version: "3.9"

# NOTE: QlOrm currently uses @libsql/client (Turso/LibSQL — SQLite-compatible).
# To use Postgres, migrate packages/ql-orm/src/index.ts to use the `pg` driver
# (DATABASE_URL=postgres://user:pass@postgres:5432/dbname) before running.
# See packages/ql-orm/package.json for the dependency swap.

services:
  postgres:
    image: postgres:16-alpine
    container_name: moonwitness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-moonwitness}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moonwitness}
      POSTGRES_DB: ${DB_NAME:-moonwitness}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: moonwitness-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER:-moonwitness}:${DB_PASSWORD:-moonwitness}@postgres:5432/${DB_NAME:-moonwitness}
      NODE_ENV: production

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: moonwitness-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3030}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3000}

volumes:
  postgres_data: