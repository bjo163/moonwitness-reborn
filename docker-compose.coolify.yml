# Coolify deployment stack: api + web.
#
# Bedanya dengan docker-compose.yml (dev lokal):
# - Tidak ada published port di host. Traefik milik Coolify sudah memegang 80/443
#   dan menjangkau container lewat network aplikasi, jadi routing diarahkan lewat
#   label di bawah. Compose ini tidak mendeklarasikan `networks:` supaya Coolify
#   yang menghubungkannya ke Traefik.
# - Tidak ada service Postgres: QlOrm masih memakai driver @libsql/client, jadi api
#   menulis ke file SQLite di volume `api_data`. Database ditambahkan ke stack ini
#   setelah packages/ql-orm pindah ke driver pg.
# - Nama domain dipakai bersama: domain custom (a-l-l-a-h.com + moonwitness.biz.id untuk
#   web, api.moonwitness.biz.id untuk api) dan wildcard *.apps.mycocolink.com. Domain
#   custom butuh label Traefik manual seperti di bawah; Coolify hanya membuatkannya
#   otomatis untuk subdomain *.apps.mycocolink.com.
# - PROVIDER_ENCRYPTION_KEY diisi lewat environment Coolify, bukan dari repo. Kosong
#   berarti penyimpanan credential provider /providers dinonaktifkan (api tetap jalan).
#
# Usage: set in Coolify -> Application -> Configuration -> Docker Compose
# Location: /docker-compose.coolify.yml
name: moonwitness-reborn

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Jakarta
      PORT: 3000
      DATABASE_URL: file:/app/data/moonwitness.db
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:-}
      # Klaim super_admin sekali di produksi: isi keduanya di environment Coolify,
      # registrasi akun owner, lalu kosongkan kembali keduanya.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
    expose:
      - "3000"
    volumes:
      - api_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.moonwitness-reborn-api-http.rule=Host(`api.moonwitness.biz.id`, `moonwitness-reborn-api.apps.mycocolink.com`)
      - traefik.http.routers.moonwitness-reborn-api-http.entrypoints=http
      - traefik.http.routers.moonwitness-reborn-api-http.middlewares=moonwitness-reborn-api-redirect
      - traefik.http.middlewares.moonwitness-reborn-api-redirect.redirectscheme.scheme=https
      - traefik.http.routers.moonwitness-reborn-api-https.rule=Host(`api.moonwitness.biz.id`, `moonwitness-reborn-api.apps.mycocolink.com`)
      - traefik.http.routers.moonwitness-reborn-api-https.entrypoints=https
      - traefik.http.routers.moonwitness-reborn-api-https.tls=true
      - traefik.http.routers.moonwitness-reborn-api-https.tls.certresolver=letsencrypt
      - traefik.http.services.moonwitness-reborn-api.loadbalancer.server.port=3000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3000
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: Asia/Jakarta
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.moonwitness-reborn-web-http.rule=Host(`a-l-l-a-h.com`, `moonwitness.biz.id`, `moonwitness-reborn.apps.mycocolink.com`)
      - traefik.http.routers.moonwitness-reborn-web-http.entrypoints=http
      - traefik.http.routers.moonwitness-reborn-web-http.middlewares=moonwitness-reborn-web-redirect
      - traefik.http.middlewares.moonwitness-reborn-web-redirect.redirectscheme.scheme=https
      - traefik.http.routers.moonwitness-reborn-web-https.rule=Host(`a-l-l-a-h.com`, `moonwitness.biz.id`, `moonwitness-reborn.apps.mycocolink.com`)
      - traefik.http.routers.moonwitness-reborn-web-https.entrypoints=https
      - traefik.http.routers.moonwitness-reborn-web-https.tls=true
      - traefik.http.routers.moonwitness-reborn-web-https.tls.certresolver=letsencrypt
      - traefik.http.services.moonwitness-reborn-web.loadbalancer.server.port=3001

volumes:
  api_data:
