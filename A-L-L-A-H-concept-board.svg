    <text x="130.5" y="432" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#203228">BUKA TINJAUAN  ↗</text>

    <rect x="519" y="229" width="246" height="225" rx="18" fill="#f4f3eb" stroke="#e8e9df"/>
