    <line x1="35" y1="875" x2="765" y2="875" stroke="#ecece4"/>
    <text x="35" y="912" class="sans" font-size="10" fill="#98a199">Perubahan dan refleksi tetap milik pengguna. Tidak ada skor moral.</text>
