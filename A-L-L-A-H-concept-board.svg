    <text x="59" y="312" class="serif" font-size="31" fill="#faf8ef">4 dari 5 komitmen</text>
    <text x="59" y="338" class="sans" font-size="13" fill="#c3cec4">sudah ditinjau dengan jujur</text>
    <rect x="59" y="362" width="420" height="8" rx="4" fill="#40564a"/>
    <rect x="59" y="362" width="336" height="8" rx="4" fill="url(#progress)"/>
    <text x="59" y="400" class="sans" font-size="11" fill="#a9b9ae">1 komitmen menunggu refleksi</text>
