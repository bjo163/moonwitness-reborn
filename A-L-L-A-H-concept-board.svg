    <rect x="608" y="357" width="16" height="40" rx="5" fill="#92aa79"/>
    <rect x="637" y="332" width="16" height="65" rx="5" fill="#789b78"/>
    <rect x="666" y="351" width="16" height="46" rx="5" fill="#92aa79"/>
    <rect x="695" y="340" width="16" height="57" rx="5" fill="#92aa79"/>
    <rect x="724" y="320" width="16" height="77" rx="5" fill="#c59b5d"/>
    <text x="558" y="416" text-anchor="middle" class="sans" font-size="9" fill="#8a968e">S</text>
    <text x="587" y="416" text-anchor="middle" class="sans" font-size="9" fill="#8a968e">S</text>
    <text x="616" y="416" text-anchor="middle" class="sans" font-size="9" fill="#8a968e">R</text>
    <text x="645" y="416" text-anchor="middle" class="sans" font-size="9" fill="#8a968e">K</text>
    <text x="674" y="416" text-anchor="middle" class="sans" font-size="9" fill="#8a968e">J</text>
    <text x="703" y="416" text-anchor="middle" class="sans" font-size="9" fill="#8a968e">S</text>
    <text x="732" y="416" text-anchor="middle" class="sans" font-size="9" fill="#8a968e">M</text>

    <text x="35" y="502" class="sans" font-size="16" font-weight="650" fill="#233129">Yang perlu ditinjau</text>
    <text x="765" y="502" text-anchor="end" class="sans" font-size="11" font-weight="600" fill="#7b8a7f">LIHAT SEMUA  →</text>

    <rect x="35" y="522" width="730" height="75" rx="14" fill="#fffefa" stroke="#e7e9e1"/>
    <rect x="50" y="538" width="42" height="42" rx="12" fill="#e9eee1"/>
    <path d="M63 559 l6 6 12-14" fill="none" stroke="#6b8c68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="551" class="sans" font-size="12" font-weight="650" fill="#344239">Belajar 20 menit tanpa gangguan</text>
    <text x="108" y="571" class="sans" font-size="11" fill="#89948d">Komitmen pribadi  ·  Terakhir ditinjau kemarin</text>
    <rect x="663" y="545" width="83" height="27" rx="13.5" fill="#edf1e8"/>
    <text x="704.5" y="563" text-anchor="middle" class="sans" font-size="10" font-weight="650" fill="#668260">PERLU TINJAU</text>

    <rect x="35" y="610" width="730" height="75" rx="14" fill="#fffefa" stroke="#e7e9e1"/>
    <rect x="50" y="626" width="42" height="42" rx="12" fill="#f1eadb"/>
    <circle cx="71" cy="647" r="9" fill="none" stroke="#b48b50" stroke-width="1.7"/>
    <path d="M71 641 v7 l5 3" fill="none" stroke="#b48b50" stroke-width="1.7" stroke-linecap="round"/>
    <text x="108" y="639" class="sans" font-size="12" font-weight="650" fill="#344239">Catatan belajar: mendengar aktif</text>
    <text x="108" y="659" class="sans" font-size="11" fill="#89948d">Ruang komunitas  ·  3 anggota menambahkan refleksi</text>
    <rect x="672" y="633" width="74" height="27" rx="13.5" fill="#f5eee1"/>
    <text x="709" y="651" text-anchor="middle" class="sans" font-size="10" font-weight="650" fill="#987443">BERJALAN</text>

    <rect x="35" y="698" width="730" height="145" rx="16" fill="#f5f4ed"/>
    <text x="57" y="729" class="sans tiny" fill="#77857c">RUANG KOMUNITAS</text>
    <text x="57" y="761" class="serif ink" font-size="22">Belajar bersama, tetap saling menjaga.</text>
    <text x="57" y="786" class="sans" font-size="11" fill="#7f8b83">Tinjauan bersama memberi konteks—bukan skor untuk membandingkan orang.</text>
    <circle cx="601" cy="811" r="13" fill="#829a79" stroke="#f5f4ed" stroke-width="3"/>
    <circle cx="626" cy="811" r="13" fill="#c69d69" stroke="#f5f4ed" stroke-width="3"/>
    <circle cx="651" cy="811" r="13" fill="#829a79" stroke="#f5f4ed" stroke-width="3"/>
