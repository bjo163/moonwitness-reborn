    <text x="35" y="112" class="sans" font-size="12" fill="#77857c">SENIN, 2 NOVEMBER</text>
    <text x="35" y="154" class="serif ink" font-size="31" letter-spacing="-.7">Selamat pagi, Nadia.</text>
    <text x="35" y="181" class="sans" font-size="13" fill="#7b887f">Sempatkan meninjau satu komitmen hari ini.</text>
    <rect x="35" y="205" width="730" height="1" fill="#e9ebe3"/>

