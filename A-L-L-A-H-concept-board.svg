      <text x="50" y="34" class="sans" font-size="10" fill="#9ca9a0">Ruang pribadi</text>
      <circle cx="171" cy="20" r="2" fill="#9ca9a0"/>
      <circle cx="179" cy="20" r="2" fill="#9ca9a0"/>
      <circle cx="187" cy="20" r="2" fill="#9ca9a0"/>
    </g>
