<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" style="display:block;max-width:100%;height:auto;margin:0 auto" role="img" aria-labelledby="title description">
  <title id="title">Concept board A-L-L-A-H</title>
  <desc id="description">A concept board for Accountable Life, Learning and Action Hub, with a visual identity and an illustrative dashboard for personal and community accountability.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203d38"/>
      <stop offset="1" stop-color="#142622"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#afd079"/>
      <stop offset="1" stop-color="#78bca3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#21312b" flood-opacity=".12"/>
    </filter>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .ink { fill: #17231f; }
      .muted { fill: #718078; }
      .light { fill: #f7f5ef; }
      .soft { fill: #b7c3ba; }
      .tiny { font-size: 11px; letter-spacing: 1.7px; font-weight: 700; }
      .label { font-size: 12px; font-weight: 600; }
      .body { font-size: 14px; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#f1eee5"/>
  <circle cx="92" cy="50" r="3" fill="#91aa69"/>
  <text x="108" y="55" class="sans tiny" fill="#62766b">EARLY VISUAL CONCEPT  /  01 NOV 2026</text>
  <text x="1490" y="55" text-anchor="end" class="sans tiny" fill="#62766b">PRODUCT DIRECTION · NOT FINAL</text>

  <g transform="translate(88 138)">
    <g transform="translate(2 2)">
      <path d="M17 25 C27 5 54 5 64 25 C74 45 100 45 111 25" fill="none" stroke="#789b78" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="17" cy="25" r="5" fill="#789b78"/>
      <circle cx="64" cy="25" r="5" fill="#c59b5d"/>
      <circle cx="111" cy="25" r="5" fill="#789b78"/>
      <path d="M17 25 C27 45 54 45 64 25 C74 5 100 5 111 25" fill="none" stroke="#789b78" stroke-width="2.5" stroke-linecap="round" opacity=".58"/>
    </g>
    <text x="0" y="90" class="sans" font-size="48" font-weight="650" letter-spacing="-2.7" fill="#17231f">A-L-L-A-H</text>
    <text x="2" y="119" class="sans" font-size="13" font-weight="650" letter-spacing="2.1" fill="#61756a">ACCOUNTABLE LIFE, LEARNING &amp; ACTION HUB</text>

    <text x="0" y="206" class="serif ink" font-size="46" font-weight="400" letter-spacing="-1.7">
      <tspan x="0" dy="0">Niat jadi langkah.</tspan>
      <tspan x="0" dy="53">Langkah jadi</tspan>
      <tspan x="0" dy="53">tanggung jawab.</tspan>
    </text>
    <text x="2" y="393" class="sans" font-size="16" fill="#68766e">
      <tspan x="2" dy="0">Ruang untuk bertumbuh, belajar, lalu meninjau</tspan>
      <tspan x="2" dy="25">dampak tindakan—sendiri maupun bersama.</tspan>
    </text>

    <g transform="translate(0 476)">
      <text x="0" y="0" class="sans tiny" fill="#728077">ARAH PENGALAMAN</text>
      <path d="M5 32 V154" fill="none" stroke="#c6cec2" stroke-width="1.5"/>
      <circle cx="5" cy="35" r="4" fill="#779877"/>
      <circle cx="5" cy="94" r="4" fill="#c59b5d"/>
      <circle cx="5" cy="153" r="4" fill="#779877"/>
      <text x="24" y="40" class="sans body ink" font-weight="600">Pilih komitmen</text>
      <text x="24" y="59" class="sans" font-size="12" fill="#7b877f">tujuan yang bermakna dan jelas</text>
      <text x="24" y="99" class="sans body ink" font-weight="600">Belajar &amp; bertindak</text>
      <text x="24" y="118" class="sans" font-size="12" fill="#7b877f">langkah kecil, dengan konteks</text>
      <text x="24" y="158" class="sans body ink" font-weight="600">Tinjau dengan jujur</text>
      <text x="24" y="177" class="sans" font-size="12" fill="#7b877f">progres, bukti, dan hal yang belum pasti</text>
    </g>

    <g transform="translate(0 723)">
      <text x="0" y="0" class="sans tiny" fill="#728077">PALET KONSEP</text>
      <rect x="0" y="20" width="54" height="36" rx="10" fill="#17231f"/>
      <rect x="64" y="20" width="54" height="36" rx="10" fill="#f7f5ef" stroke="#d8d8ca"/>
      <rect x="128" y="20" width="54" height="36" rx="10" fill="#91aa69"/>
      <rect x="192" y="20" width="54" height="36" rx="10" fill="#78a99a"/>
      <rect x="256" y="20" width="54" height="36" rx="10" fill="#c59b5d"/>
      <text x="0" y="78" class="sans" font-size="11" fill="#78847c">INK</text>
      <text x="64" y="78" class="sans" font-size="11" fill="#78847c">PAPER</text>
      <text x="128" y="78" class="sans" font-size="11" fill="#78847c">GROWTH</text>
      <text x="192" y="78" class="sans" font-size="11" fill="#78847c">TRUST</text>
      <text x="256" y="78" class="sans" font-size="11" fill="#78847c">REVIEW</text>
    </g>

    <g transform="translate(0 862)">
      <text x="0" y="0" class="sans tiny" fill="#728077">RASA VISUAL</text>
      <text x="0" y="29" class="serif ink" font-size="23">Hangat, terukur, manusiawi.</text>
      <text x="0" y="57" class="sans" font-size="12" fill="#78847c">Editorial yang tenang × alat kerja yang jelas</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="505" y="112" width="1025" height="972" rx="28" fill="#fffefa"/>
    <path d="M533 112 H1502 Q1530 112 1530 140 V1084 H505 V140 Q505 112 533 112Z" fill="#fffefa"/>
