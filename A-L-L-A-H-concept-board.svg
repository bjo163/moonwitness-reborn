    <circle cx="43" cy="444" r="7" fill="#c1ccaa"/>
    <text x="58" y="441" class="sans" font-size="11" fill="#91a198">AKTIF</text>
    <text x="58" y="456" class="sans" font-size="12" font-weight="600" fill="#f1f0e8">Pribadi</text>
    <text x="186" y="450" class="sans" font-size="16" fill="#91a198">⌄</text>
    <text x="27" y="512" class="sans" font-size="11" fill="#91a198">Beralih ke ruang komunitas</text>

    <g transform="translate(24 875)">
